version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: anonymizer_pg_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: production_mock
    ports:
      - "5432:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d production_mock"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_test: